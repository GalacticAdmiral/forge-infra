apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: forge-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forge-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: forge-root-ca
  secretName: forge-root-ca-secret
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: forge-bootstrap-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: forge-app-ca
spec:
  ca:
    secretName: forge-root-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-server-certificate
spec:
  secretName: rabbitmq-server-tls-secret
  privateKey:
    rotationPolicy: Never
  issuerRef:
    name: forge-app-ca
    kind: ClusterIssuer
  commonName: forge-rabbitmq
  dnsNames:
    - rabbitmq-service
    - rabbitmq-service.default.svc.cluster.local