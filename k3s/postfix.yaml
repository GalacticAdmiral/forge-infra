apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-config
data:
  ALLOWED_SENDER_DOMAINS: forge.local
  POSTFIX_mynetworks: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16,172.16.0.0/12
  TZ: Europe/Oslo
---
apiVersion: v1
kind: Service
metadata:
  name: postfix-service
spec:
  type: ClusterIP
  selector:
    app: postfix
  ports:
    - protocol: TCP
      port: 25
      targetPort: 25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postfix
  template:
    metadata:
      labels:
        app: postfix
    spec:
      containers:
        - name: postfix
          image: boky/postfix
          ports:
            - containerPort: 25
              name: smtp
          env:
            - name: RELAYHOST_PASSWORD_FILE
              value: /run/secrets/postfix_password/postfix-password
          envFrom:
            - configMapRef:
                name: postfix-config
          volumeMounts:
            - mountPath: /run/secrets/postfix_password
              name: password-secret
              readOnly: true
      volumes:
        - name: password-secret
          secret:
            secretName: postfix-password-secret